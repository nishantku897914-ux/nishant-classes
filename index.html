<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nishant Classes • Student Portal</title>
<meta name="description" content="Nishant Classes Student Portal - Learn Today, Lead Tomorrow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#174b98">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--blue:#174b98;--blue2:#1857ad;--sky:#eaf2ff;--bg:#f2f6fc;--ink:#17243a;--mute:#667085;--line:#d5e0ef;--ok:#067647;--err:#b42318;--gold:#f5b301}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#123c7c 0%,#1d5fc2 100%);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 20px 64px;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto 12px;box-shadow:0 6px 18px #0003}
h1{margin:0;font-size:26px;letter-spacing:1.5px}
header p{margin:6px 0 0;opacity:.9;font-size:15px}
.tag{display:inline-block;margin-top:12px;background:#ffffff22;border:1px solid #ffffff44;padding:4px 12px;border-radius:999px;font-size:13px}
main{max-width:680px;margin:-40px auto 24px;padding:0 16px}
.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 6px 24px #142a4b14;margin-bottom:16px}
h2{margin:0 0 12px;font-size:21px}
h3{margin:22px 0 10px;font-size:17px}
label{display:block;font-size:14px;font-weight:600;margin-top:10px}
input,button{width:100%;padding:13px 14px;margin:6px 0;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid #1857ad33;border-color:var(--blue2)}
button{background:var(--blue2);color:#fff;border:0;cursor:pointer;font-weight:650;transition:transform .05s,background .15s}
button:active{transform:scale(.98)}
