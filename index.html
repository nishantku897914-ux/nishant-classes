<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Nishant Classes • Student Portal</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f6fa">
<link rel="icon" href="icon-192.png">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f6fa;
color:#334451;
font-family:system-ui,'Noto Sans Devanagari',sans-serif;
padding-bottom:78px;
}

header{
height:74px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 19px;
box-shadow:0 1px 8px #0000000c;
position:sticky;
top:0;
z-index:5;
}

header strong{
font-size:23px;
font-weight:650;
}

header button{
width:auto;
background:none;
color:#34434d;
font-size:27px;
padding:5px;
border:0;
}

.wrap{
max-width:950px;
margin:auto;
padding:22px 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:14px;
}

.tile{
border:1px solid #edf0f3;
min-height:155px;
background:white;
border-radius:13px;
box-shadow:0 2px 9px #0000000b;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
text-align:center;
padding:14px 7px;
color:#526674;
font-weight:650;
font-size:16px;
cursor:pointer;
}

.tile .icon{
font-size:49px;
line-height:1.2;
}

.tile:active{transform:scale(.98)}

.title{
font-size:21px;
margin:28px 0 14px;
}

.panel{
background:#fff;
border-radius:14px;
padding:19px;
margin:15px 0;
box-shadow:0 3px 12px #0001;
}

.hidden{display:none!important}

input,select,.action{
width:100%;
font:inherit;
border-radius:9px;
padding:12px;
margin:6px 0 12px;
border:1px solid #d7e0e8;
}

.action{
background:#245ba4;
color:white;
border:0;
font-weight:650;
cursor:pointer;
}

.sub{
background:#edf3ff;
color:#245ba4;
}

.error{color:#b42318}
.success{color:#067647}

.badge{
background:#eaf2ff;
color:#174b98;
border-radius:25px;
padding:5px 11px;
font-size:13px;
}

.premium{
background:#fff1c8;
color:#765500;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
box-shadow:0 -2px 12px #0001;
z-index:6;
padding-bottom:env(safe-area-inset-bottom);
}

.bottom button{
border:0;
background:none;
color:#6b7680;
padding:9px 2px;
font-size:11px;
min-width:60px;
}

.bottom span{
display:block;
font-size:23px;
}

.bottom .active{color:#245ba4}

#classes{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

#classes button{
padding:10px 2px;
border:0;
border-radius:8px;
background:#eaf2ff;
color:#174b98;
}

#classes button.active{
background:#174b98;
color:white;
}

@media(max-width:390px){
.tile
